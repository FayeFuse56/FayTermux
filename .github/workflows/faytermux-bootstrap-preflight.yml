name: FayTermux bootstrap preflight

on:
  push:
    branches:
      - feature/independent-app-bootstrap
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package identity
        run: python3 scripts/check_package_identity.py
      - name: Check bootstrap tools compile
        run: python3 -m py_compile scripts/audit_bootstrap.py scripts/verify_fay_bootstrap_release.py
      - name: Check manifest validator rejects missing archives
        run: |
          cat > /tmp/fay-invalid-manifest.json <<'EOF'
          {"package_id":"com.fay.termux","prefix":"/data/data/com.fay.termux/files/usr","variant":"apt-android-7","archives":{}}
          EOF
          if python3 scripts/verify_fay_bootstrap_release.py /tmp/fay-invalid-manifest.json; then
            echo "ERROR: invalid bootstrap manifest unexpectedly passed"
            exit 1
          fi
          echo "PASS: incomplete release rejected"
