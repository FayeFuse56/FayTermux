name: FayTermux package identity audit

on:
  push:
    branches:
      - feature/independent-app-bootstrap
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  package-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package identity and prevent unsafe renames
        run: python3 scripts/check_package_identity.py
